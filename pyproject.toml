[project]
name = "qksm"
version = "0.1.0"
description = "Quantum Kernel Survival Models: quantum kernels in Survival SVM and Kernel Cox"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn",
    "scikit-survival",
    "lifelines",
    "qiskit",
    "matplotlib",
]

[dependency-groups]
dev = [
    "pytest",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qksm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
